version: '3.8'
services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: buildtrack2024
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:buildtrack2024@mongo:27017/buildtrack?authSource=admin
      JWT_SECRET: your_secret_key
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost:3000
      NODE_ENV: production
      # ── Email (for PO send feature) ───────────────────────────────
      # Replace with your SMTP credentials. If left blank, email is skipped silently.
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: your@gmail.com
      EMAIL_PASS: your_app_password
      EMAIL_FROM: "BuildTrack <noreply@buildtrack.app>"
    depends_on:
      - mongo
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
